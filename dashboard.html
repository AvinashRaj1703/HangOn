<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLink Multi-Target Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #0f172a;
            --bg-card: #131d35;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-cyan: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--glow-cyan);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            color: #050505;
        }

        .brand-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.88rem;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        .dot.offline {
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* Main Workspace */
        main {
            flex: 1;
            padding: 28px;
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
        }

        /* Target Link Bar */
        .target-url-banner {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .target-url-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .url-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            max-width: 100%;
            overflow-x: auto;
        }

        .btn-copy {
            background: rgba(0, 242, 254, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-copy:hover {
            background: rgba(0, 242, 254, 0.25);
            box-shadow: var(--glow-cyan);
        }

        /* Grid Layout */
        .targets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 24px;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
            background: var(--bg-surface);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
        }

        .empty-state-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            color: var(--text-muted);
            opacity: 0.4;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Target Card */
        .target-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .target-card:hover {
            border-color: rgba(0, 242, 254, 0.35);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), var(--glow-cyan);
        }

        .target-card-header {
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .target-id {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .target-status-badge {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Dual Camera Grid */
        .target-dual-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: #050811;
            position: relative;
            min-height: 260px;
        }

        .camera-pane {
            position: relative;
            background: #000000;
            width: 100%;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .camera-pane video, .camera-pane canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .camera-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .camera-tag .dot {
            width: 6px;
            height: 6px;
        }

        .video-overlay-loader {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            z-index: 20;
        }

        .target-card-footer {
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-action.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        @media (max-width: 768px) {
            .targets-grid {
                grid-template-columns: 1fr;
            }
            .target-dual-grid {
                grid-template-columns: 1fr;
            }
            header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </div>
            <div>
                <div class="brand-title">OMNILINK LIVE</div>
            </div>
        </div>
        <div class="status-bar">
            <div class="status-pill">
                <span class="dot" id="serverDot"></span>
                <span id="serverStatusText">CONNECTING...</span>
            </div>
            <div class="status-pill">
                <span>TARGETS:</span>
                <strong id="targetCount" style="color: var(--accent-cyan);">0</strong>
            </div>
        </div>
    </header>

    <main>
        <div class="target-url-banner">
            <div>
                <span class="target-url-label">TARGET INVITATION URL:</span>
                <div class="url-box" id="targetUrlDisplay">Loading...</div>
            </div>
            <button class="btn-copy" onclick="copyTargetLink()">Copy Target Link</button>
        </div>

        <div class="targets-grid" id="targetsGrid">
            <div class="empty-state" id="emptyState">
                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <h3>No Active Targets</h3>
                <p>Share the target link with remote users. When they click to verify, their live stream will appear here in real time.</p>
            </div>
        </div>
    </main>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = window.location.host || "hangon-k31m.onrender.com";
        const wsUrl = `${protocol}//${host}/ws/controller`;

        // Update target URL display
        const targetFullUrl = `${window.location.protocol}//${host}/target`;
        document.getElementById('targetUrlDisplay').innerText = targetFullUrl;

        function copyTargetLink() {
            navigator.clipboard.writeText(targetFullUrl).then(() => {
                const btn = document.querySelector('.btn-copy');
                const orig = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => btn.innerText = orig, 2000);
            });
        }

        // WebRTC Config with low-latency candidate pooling, STUN & TURN relay fallback
        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun3.l.google.com:19302" },
                { urls: "stun:stun4.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" },
                { urls: "stun:stun.twilio.com:3478" }
            ],
            iceCandidatePoolSize: 10
        };

        let ws;
        let pingInterval = null;
        // Map of targetId -> { pc, mediaStream, pendingIce: [], cardEl, videoEl, loaderEl, badgeEl }
        const targets = new Map();

        function updateTargetCount() {
            document.getElementById('targetCount').innerText = targets.size;
            const emptyState = document.getElementById('emptyState');
            if (targets.size === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }

        function ensureTargetSession(targetId) {
            let session = targets.get(targetId);
            if (session) return session;

            const grid = document.getElementById('targetsGrid');
            const card = document.createElement('div');
            card.className = 'target-card';
            card.id = `card-${targetId}`;
            card.innerHTML = `
                <div class="target-card-header">
                    <div class="target-id">
                        <span class="dot"></span>
                        TARGET [${targetId}]
                    </div>
                    <span class="target-status-badge" id="badge-${targetId}">CONNECTING</span>
                </div>
                
                <div class="target-video-wrapper" style="position: relative; background: #000; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                    <div class="camera-tag" style="position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #fff; display: flex; align-items: center; gap: 6px;">
                        <span class="dot" id="camDot-${targetId}" style="width: 7px; height: 7px; background: #00f2fe;"></span>
                        <span id="camLabel-${targetId}">FRONT CAMERA (ACTIVE)</span>
                    </div>

                    <video id="video-${targetId}" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; background: #000;"></video>
                    
                    <div class="video-overlay-loader" id="loader-${targetId}">
                        <div class="dot" style="animation-duration: 0.8s;"></div>
                        <span>Connecting Video Stream...</span>
                    </div>
                </div>

                <div class="target-card-footer">
                    <span id="time-${targetId}">Stream Active</span>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn-action" id="camBtn-${targetId}" onclick="toggleActiveCamera('${targetId}')">🔄 Switch to Rear Camera</button>
                        <button class="btn-action" id="cycleBtn-${targetId}" onclick="toggleAutoCycle('${targetId}')">🔁 Auto-Switch: OFF</button>
                        <button class="btn-action" onclick="requestTargetOffer('${targetId}')">Reconnect</button>
                        <button class="btn-action" id="zoomBtn-${targetId}" onclick="toggleZoom('${targetId}')">Zoom: Out</button>
                        <button class="btn-action" id="muteBtn-${targetId}" onclick="toggleMute('${targetId}')">Unmute Audio</button>
                        <button class="btn-action" onclick="fullscreenVideo('${targetId}')">Fullscreen</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);

            const videoEl = card.querySelector(`#video-${targetId}`);
            const loaderEl = card.querySelector(`#loader-${targetId}`);
            const badgeEl = card.querySelector(`#badge-${targetId}`);

            videoEl.muted = true;

            session = {
                pc: null,
                pendingIce: [],
                cardEl: card,
                videoEl,
                loaderEl,
                badgeEl,
                activeCamera: 'user',
                cycleInterval: null
            };
            targets.set(targetId, session);
            updateTargetCount();
            return session;
        }

        function toggleActiveCamera(targetId) {
            const session = targets.get(targetId);
            const targetCam = (session && session.activeCamera === 'environment') ? 'user' : 'environment';
            switchCamera(targetId, targetCam);
        }

        function switchCamera(targetId, specificMode) {
            const session = targets.get(targetId);
            if (!session) return;

            const nextCam = specificMode || (session.activeCamera === 'environment' ? 'user' : 'environment');
            const btn = document.getElementById(`camBtn-${targetId}`);
            const camLabel = document.getElementById(`camLabel-${targetId}`);
            const camDot = document.getElementById(`camDot-${targetId}`);

            if (btn) btn.innerText = "⏳ Switching...";
            if (camLabel) camLabel.innerText = nextCam === 'environment' ? "SWITCHING TO REAR..." : "SWITCHING TO FRONT...";
            if (camDot) { camDot.style.background = "#f59e0b"; camDot.style.boxShadow = "0 0 8px #f59e0b"; }

            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log(`[*] Sending switch_camera to target ${targetId}: ${nextCam}`);
                ws.send(JSON.stringify({
                    targetId,
                    type: "switch_camera",
                    camera: nextCam
                }));
            }
        }

        function toggleAutoCycle(targetId) {
            const session = targets.get(targetId);
            if (!session) return;

            const btn = document.getElementById(`cycleBtn-${targetId}`);
            if (session.cycleInterval) {
                clearInterval(session.cycleInterval);
                session.cycleInterval = null;
                if (btn) {
                    btn.innerText = "🔁 Auto-Switch: OFF";
                    btn.classList.remove('active');
                }
            } else {
                if (btn) {
                    btn.innerText = "🔁 Auto-Switch: ON (5s)";
                    btn.classList.add('active');
                }
                session.cycleInterval = setInterval(() => {
                    toggleActiveCamera(targetId);
                }, 5000);
            }
        }

        function updateCameraUI(targetId, activeCam) {
            const session = targets.get(targetId);
            if (!session) return;

            session.activeCamera = activeCam;
            const btn = document.getElementById(`camBtn-${targetId}`);
            const camLabel = document.getElementById(`camLabel-${targetId}`);
            const camDot = document.getElementById(`camDot-${targetId}`);

            if (activeCam === 'environment') {
                if (btn) btn.innerText = "🔄 Switch to Front Camera";
                if (camLabel) camLabel.innerText = "REAR CAMERA (ACTIVE)";
                if (camDot) { camDot.style.background = "#10b981"; camDot.style.boxShadow = "0 0 8px #10b981"; }
            } else {
                if (btn) btn.innerText = "🔄 Switch to Rear Camera";
                if (camLabel) camLabel.innerText = "FRONT CAMERA (ACTIVE)";
                if (camDot) { camDot.style.background = "#00f2fe"; camDot.style.boxShadow = "0 0 8px #00f2fe"; }
            }
        }

        function requestTargetOffer(targetId) {
            const session = targets.get(targetId);
            if (session) {
                session.loaderEl.style.display = 'flex';
                session.badgeEl.innerText = 'CONNECTING';
                session.badgeEl.style.color = '#00f2fe';
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log(`[*] Requesting fresh offer from target: ${targetId}`);
                ws.send(JSON.stringify({
                    targetId,
                    type: "request_offer"
                }));
            }
        }

        function connectWebSocket() {
            const serverDot = document.getElementById('serverDot');
            const serverStatusText = document.getElementById('serverStatusText');

            if (ws) {
                try {
                    ws.onclose = null;
                    ws.close();
                } catch (e) {}
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("[+] Controller connected to signaling server");
                serverDot.classList.remove('offline');
                serverStatusText.innerText = "ONLINE";

                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "ping" }));
                    }
                }, 20000);
            };

            ws.onmessage = async (event) => {
                try {
                    const msg = JSON.parse(event.data);

                    if (msg.type === "pong") {
                        return;
                    }
                    
                    if (msg.type === "active_targets") {
                        console.log("[*] Active targets received:", msg.targets);
                        msg.targets.forEach(targetId => {
                            ensureTargetSession(targetId);
                            requestTargetOffer(targetId);
                        });
                    } else if (msg.type === "target_joined") {
                        console.log("[+] Target joined:", msg.targetId);
                        ensureTargetSession(msg.targetId);
                        requestTargetOffer(msg.targetId);
                    } else if (msg.type === "target_left") {
                        console.log("[-] Target left:", msg.targetId);
                        removeTargetSession(msg.targetId);
                    } else if (msg.type === "camera_info" && msg.targetId) {
                        updateCameraUI(msg.targetId, msg.camera);
                    } else if (msg.type === "offer" && msg.targetId) {
                        console.log("[+] Received offer from target:", msg.targetId);
                        await handleTargetOffer(msg.targetId, msg.data);
                    } else if (msg.type === "ice" && msg.targetId) {
                        const session = ensureTargetSession(msg.targetId);
                        if (session.pc && session.pc.remoteDescription && session.pc.remoteDescription.type) {
                            try {
                                await session.pc.addIceCandidate(msg.data);
                            } catch (e) {
                                console.warn("Failed to add ICE candidate:", e);
                            }
                        } else {
                            session.pendingIce.push(msg.data);
                        }
                    }
                } catch (e) {
                    console.error("Error processing controller message:", e);
                }
            };

            ws.onerror = (err) => {
                console.error("Signaling socket error:", err);
                serverDot.classList.add('offline');
                serverStatusText.innerText = "ERROR";
            };

            ws.onclose = () => {
                console.log("Signaling closed. Reconnecting in 1.5s...");
                if (pingInterval) clearInterval(pingInterval);
                serverDot.classList.add('offline');
                serverStatusText.innerText = "RECONNECTING";
                setTimeout(connectWebSocket, 1500);
            };
        }

        async function handleTargetOffer(targetId, offerSdp) {
            const session = ensureTargetSession(targetId);

            if (session.pc) {
                try {
                    session.pc.ontrack = null;
                    session.pc.onicecandidate = null;
                    session.pc.onconnectionstatechange = null;
                    session.pc.close();
                } catch (e) {
                    console.warn("Error closing previous controller pc:", e);
                }
            }

            const pc = new RTCPeerConnection(rtcConfig);
            session.pc = pc;

            pc.ontrack = (event) => {
                console.log(`[+] Track received from target ${targetId}:`, event.track.kind);
                
                let stream = session.videoEl.srcObject;
                if (!stream || !(stream instanceof MediaStream)) {
                    stream = new MediaStream();
                    session.videoEl.srcObject = stream;
                }
                
                // Add track if not already in stream
                if (!stream.getTracks().some(t => t.id === event.track.id)) {
                    stream.addTrack(event.track);
                }

                session.videoEl.play().catch(e => console.log("Video playback note:", e));

                if (event.track.kind === 'video') {
                    session.loaderEl.style.display = 'none';
                    session.badgeEl.innerText = 'LIVE STREAMING';
                    session.badgeEl.style.color = '#10b981';
                }
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        targetId,
                        type: "ice",
                        data: event.candidate
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`[*] Target ${targetId} Connection State:`, pc.connectionState);
                if (pc.connectionState === "connected") {
                    session.loaderEl.style.display = 'none';
                    session.badgeEl.innerText = 'LIVE STREAMING';
                    session.badgeEl.style.color = '#10b981';
                } else if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
                    session.badgeEl.innerText = 'RECONNECTING';
                    session.badgeEl.style.color = '#f59e0b';
                }
            };

            // Set remote offer & send answer
            await pc.setRemoteDescription(new RTCSessionDescription(offerSdp));

            // Flush any pending candidates safely
            while (session.pendingIce.length > 0) {
                const cand = session.pendingIce.shift();
                try {
                    await pc.addIceCandidate(cand);
                } catch (e) {
                    console.warn("Failed to add queued candidate:", e);
                }
            }

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log(`[+] Dispatched answer for target: ${targetId}`);
                ws.send(JSON.stringify({
                    targetId,
                    type: "answer",
                    data: answer
                }));
            }
        }

        function removeTargetSession(targetId) {
            const session = targets.get(targetId);
            if (!session) return;

            try {
                if (session.pc) session.pc.close();
            } catch (e) {}
            if (session.cardEl && session.cardEl.parentNode) {
                session.cardEl.remove();
            }
            targets.delete(targetId);
            updateTargetCount();
        }

        function toggleMute(targetId) {
            const video = document.getElementById(`video-${targetId}`);
            const btn = document.getElementById(`muteBtn-${targetId}`);
            if (video && btn) {
                video.muted = !video.muted;
                btn.innerText = video.muted ? "Unmute Audio" : "Mute Audio";
            }
        }

        function toggleZoom(targetId) {
            const video = document.getElementById(`video-${targetId}`);
            const btn = document.getElementById(`zoomBtn-${targetId}`);
            if (video && btn) {
                if (video.style.objectFit === "cover") {
                    video.style.objectFit = "contain";
                    btn.innerText = "Zoom: Out";
                } else {
                    video.style.objectFit = "cover";
                    btn.innerText = "Zoom: In";
                }
            }
        }

        function fullscreenVideo(targetId) {
            const video = document.getElementById(`video-${targetId}`);
            if (video) {
                if (video.requestFullscreen) video.requestFullscreen();
                else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            }
        }

        // Start connection
        connectWebSocket();
    </script>
</body>
